  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02070d" />
      <stop offset="0.55" stop-color="#092640" />
      <stop offset="1" stop-color="#07311f" />
    </linearGradient>
    <clipPath id="iconClip">
      <rect x="82" y="113" width="404" height="404" rx="76" />
    </clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#background)" />
  <circle cx="1080" cy="90" r="260" fill="#20e26f" opacity="0.08" />
  <circle cx="950" cy="650" r="360" fill="#209cff" opacity="0.08" />
