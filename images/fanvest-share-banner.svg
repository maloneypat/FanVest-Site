  <text x="550" y="312" fill="#32e77a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="46" font-weight="700">Fantasy Invest</text>
  <text x="550" y="390" fill="#d8e4ec" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="35" font-weight="600">Contests · Results · Achievements</text>
  <text x="550" y="456" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700">Open the shared FanVest link</text>
